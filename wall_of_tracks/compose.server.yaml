services:
  api:
    ports: !reset []

  site:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      site:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-student18.wt.thomasjuldo.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - visit-counter

networks:
  visit-counter:
    external: true
    name: ${VISIT_COUNTER_NETWORK:-visit-counter_default}

volumes:
  caddy-data:
  caddy-config:
