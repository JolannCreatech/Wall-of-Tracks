<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta
      name="description"
      content="Wall of Tracks — your recent Last.fm scrobbles, in a working iPod."
    />
    <title>Wall of Tracks</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <span class="wordmark">Wall of Tracks</span>
        <button class="listener" id="listener-button" type="button">
          <span class="listener-dot" aria-hidden="true"></span>
          <span id="listener-name">Last.fm</span>
        </button>
      </header>

      <main class="stage" aria-label="Wall of Tracks iPod">
        <div class="ipod" id="ipod">
          <div class="screen-bezel">
            <div class="screen theme-dark is-boot" id="screen">
              <div class="screen-status" id="screen-status">
                <span class="status-left" id="status-left">Wall of Tracks</span>
                <span class="status-right">
                  <span class="status-playing" id="status-playing" aria-hidden="true"></span>
                  <span class="battery" aria-label="Battery full"><i></i></span>
                </span>
              </div>
              <div class="screen-content" id="screen-content"></div>
              <div class="screen-glare" aria-hidden="true"></div>
            </div>
          </div>

          <div class="click-wheel" id="wheel" aria-label="iPod click wheel. Drag up or down to scroll.">
            <button class="wheel-key wheel-key--menu" id="wheel-menu" type="button">MENU</button>
            <button class="wheel-key wheel-key--prev" id="wheel-prev" type="button" aria-label="Previous">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5 10 12l7 7M10 5l-7 7 7 7"/></svg>
            </button>
            <button class="wheel-key wheel-key--next" id="wheel-next" type="button" aria-label="Next">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 5 7 7-7 7M14 5l7 7-7 7"/></svg>
            </button>
            <button class="wheel-key wheel-key--play" id="wheel-play" type="button" aria-label="Now playing">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l9-7z"/><path class="pause-bars" d="M17 5v14M21 5v14"/></svg>
            </button>
            <span class="wheel-visual" aria-hidden="true"></span>
            <button class="wheel-center" id="wheel-center" type="button" aria-label="Select">
              <span></span>
            </button>
          </div>

          <div class="ipod-foot">
            <span class="ipod-etch">Wall of Tracks</span>
          </div>
        </div>
      </main>

      <footer class="footer">
        <span>Listening data from <a href="https://www.last.fm" target="_blank" rel="noreferrer">Last.fm</a></span>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
      <p class="noscript">JavaScript is required to use the iPod.</p>
    </noscript>

    <script src="app.js" defer></script>
  </body>
</html>
